services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecopollen}
      POSTGRES_USER: ${POSTGRES_USER:-ecopollen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecopollen}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecopollen -d ecopollen"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ecopollen}:${POSTGRES_PASSWORD:-ecopollen}@db:5432/${POSTGRES_DB:-ecopollen}
      JWT_SECRET: ${JWT_SECRET:-change_me_jwt_secret}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.local}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-ChangeMe123!}
      CROSSREF_CONTACT_EMAIL: ${CROSSREF_CONTACT_EMAIL:-admin@example.local}
      POLLEN_IMPORTS_ENABLED: "${POLLEN_IMPORTS_ENABLED:-true}"
      POLLEN_IMPORT_ON_STARTUP: "${POLLEN_IMPORT_ON_STARTUP:-true}"
      POLLEN_IMPORT_HOUR_UTC: "${POLLEN_IMPORT_HOUR_UTC:-08}"
      POLLEN_IMPORT_MINUTE_UTC: "${POLLEN_IMPORT_MINUTE_UTC:-00}"
      OPEN_METEO_IMPORT_BATCH_DELAY_SECONDS: "${OPEN_METEO_IMPORT_BATCH_DELAY_SECONDS:-10}"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
